<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morph Mattar Shapes</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211b19;
      --muted: #6f6560;
      --line: #ddd5ce;
      --paper: #f6f1e9;
      --panel: #fffdf9;
      --accent: #a3191e;
      --accent-2: #ce211a;
      --shadow: 0 18px 50px rgba(42, 30, 24, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(163, 25, 30, 0.08), transparent 36%),
        linear-gradient(315deg, rgba(206, 33, 26, 0.09), transparent 42%),
        var(--paper);
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 354px) minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 249, 0.78);
      backdrop-filter: blur(18px);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .control { display: grid; gap: 9px; }

    label {
      font-size: 12px;
      font-weight: 760;
      color: #4e4540;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select, input[type="range"], button { width: 100%; }

    select {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 11px 12px;
      font: inherit;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
    }

    input[type="range"] { accent-color: var(--accent); }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 10px 24px rgba(163, 25, 30, 0.2);
    }

    button.secondary {
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
      box-shadow: none;
    }

    button:hover { transform: translateY(-1px); background: #8d1217; }
    button.secondary:hover { background: #f7f1ea; }

    .readout {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .stage-wrap {
      min-width: 0;
      padding: 28px;
      display: grid;
      place-items: center;
    }

    .stage {
      width: min(100%, 1060px);
      aspect-ratio: 1.18;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.032) 1px, transparent 1px),
        linear-gradient(rgba(0, 0, 0, 0.032) 1px, transparent 1px),
        #fffdfa;
      background-size: 44px 44px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #output path {
      shape-rendering: geometricPrecision;
      paint-order: fill;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 14px;
      color: rgba(34, 28, 27, 0.52);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .stage-wrap { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <section>
        <h1>Morph Mattar Shapes</h1>
        <p class="sub">Ferramenta local para animar os vetores da pasta Formas com morph continuo.</p>
      </section>

      <div class="control">
        <label for="fromShape">De</label>
        <select id="fromShape"></select>
      </div>

      <div class="control">
        <label for="toShape">Para</label>
        <select id="toShape"></select>
      </div>

      <div class="control">
        <div class="readout">
          <label for="progress">Morph</label>
          <span id="progressLabel">0%</span>
        </div>
        <input id="progress" type="range" min="0" max="1000" value="0">
      </div>

      <div class="control">
        <div class="readout">
          <label for="duration">Dura&ccedil;&atilde;o</label>
          <span id="durationLabel">1.8s</span>
        </div>
        <input id="duration" type="range" min="600" max="5200" step="100" value="1800">
      </div>

      <div class="row">
        <button id="play">Play</button>
        <button class="secondary" id="swap">Trocar</button>
      </div>
      <button id="loop">Loop 1-4</button>
      <button class="secondary" id="random">Aleat&oacute;rio</button>
    </aside>

    <section class="stage-wrap">
      <div class="stage">
        <svg id="output" viewBox="0 0 1000 1000" aria-label="Visualiza&ccedil;&atilde;o do morph SVG"></svg>
        <div class="hint">Arraste o controle Morph ou aperte Play</div>
      </div>
    </section>
  </main>

      const ca = parseColor(a);
      const cb = parseColor(b);
      return `rgb(${Math.round(lerp(ca[0], cb[0], t))}, ${Math.round(lerp(ca[1], cb[1], t))}, ${Math.round(lerp(ca[2], cb[2], t))})`;
    }

    function styleMap(svgText) {
      const styles = {};
      [...svgText.matchAll(/\.([a-zA-Z0-9_-]+)\s*\{([^}]+)\}/g)].forEach((match) => {
        const fill = match[2].match(/fill\s*:\s*(#[0-9a-fA-F]{3,6})/);
        if (fill) styles[match[1]] = fill[1];
      });
      return styles;
    }

    function getFill(node, styles) {
      const direct = node.getAttribute("fill");
      if (direct && direct !== "none") return direct;
      const cls = (node.getAttribute("class") || "").split(/\s+/).find((name) => styles[name]);
      return cls ? styles[cls] : "#a3191e";
    }

    function readViewBox(svg) {
      const values = (svg.getAttribute("viewBox") || "0 0 1000 1000").trim().split(/[\s,]+/).map(Number);
      return { x: values[0], y: values[1], width: values[2], height: values[3] };
    }

    function normalizePoint(point, viewBox) {
      const scale = Math.min((1000 - PAD * 2) / viewBox.width, (1000 - PAD * 2) / viewBox.height);
      const extraX = (1000 - viewBox.width * scale) / 2;
      const extraY = (1000 - viewBox.height * scale) / 2;
      return { x: extraX + (point.x - viewBox.x) * scale, y: extraY + (point.y - viewBox.y) * scale };
    }

    function resampleClosedPolyline(points) {
      if (!points.length) return [];
      const closed = [...points, points[0]];
      const lengths = [];
      let total = 0;
      for (let i = 0; i < closed.length - 1; i += 1) {
        const len = distance(closed[i], closed[i + 1]);
        lengths.push(len);
        total += len;
      }
      return Array.from({ length: POINTS_PER_CONTOUR }, (_, i) => {
        const target = (total * i) / POINTS_PER_CONTOUR;
        let travelled = 0;
        let index = 0;
        while (index < lengths.length - 1 && travelled + lengths[index] < target) {
          travelled += lengths[index];
          index += 1;
        }
        const localT = lengths[index] === 0 ? 0 : (target - travelled) / lengths[index];
        return { x: lerp(closed[index].x, closed[index + 1].x, localT), y: lerp(closed[index].y, closed[index + 1].y, localT) };
      });
    }

    function samplePath(d, viewBox) {
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", d);
      hiddenSvg.appendChild(path);
      let length = 0;
      try { length = path.getTotalLength(); } catch (error) { path.remove(); return []; }
      const points = Array.from({ length: POINTS_PER_CONTOUR }, (_, i) => normalizePoint(path.getPointAtLength((length * i) / POINTS_PER_CONTOUR), viewBox));
      path.remove();
      return points;
    }

    function parsePolygonPoints(pointsAttr, viewBox) {
      const numbers = pointsAttr.trim().split(/[\s,]+/).map(Number).filter((value) => !Number.isNaN(value));
      const raw = [];
      for (let i = 0; i < numbers.length; i += 2) raw.push(normalizePoint({ x: numbers[i], y: numbers[i + 1] }, viewBox));
      return resampleClosedPolyline(raw);
    }

    function centroid(points) {
      const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 });
      return { x: sum.x / points.length, y: sum.y / points.length };
    }

    function polygonArea(points) {
      let area = 0;
      for (let i = 0; i < points.length; i += 1) {
        const next = points[(i + 1) % points.length];
        area += points[i].x * next.y - next.x * points[i].y;
      }
      return Math.abs(area / 2);
    }

    function parseSource(item) {
      const doc = parser.parseFromString(item.svg, "image/svg+xml");
      const svg = doc.querySelector("svg");
      const viewBox = readViewBox(svg);
      const styles = styleMap(item.svg);
      const nodes = [...svg.querySelectorAll("path, polygon")];
      const contours = nodes.map((node, index) => {
        const tag = node.tagName.toLowerCase();
        const points = tag === "path" ? samplePath(node.getAttribute("d"), viewBox) : parsePolygonPoints(node.getAttribute("points"), viewBox);
        return { index, points, center: centroid(points), fill: getFill(node, styles), area: polygonArea(points) };
      }).filter((contour) => contour.points.length);
      return { ...item, contours };
    }

    function collapsedAt(contour) {
      return { ...contour, points: Array.from({ length: POINTS_PER_CONTOUR }, () => ({ ...contour.center })), area: 0 };
    }

    function shiftedPoints(points, shift, reverse) {
      const source = reverse ? [...points].reverse() : points;
      return points.map((_, index) => source[(index + shift) % source.length]);
    }

    function alignmentCost(a, b, shift, reverse) {
      const source = reverse ? [...b].reverse() : b;
      let cost = 0;
      for (let i = 0; i < a.length; i += 5) {
        const point = source[(i + shift) % source.length];
        cost += Math.hypot(a[i].x - point.x, a[i].y - point.y);
      }
      return cost;
    }

    function alignPoints(fromPoints, toPoints) {
      let best = { shift: 0, reverse: false, cost: Infinity };
      for (const reverse of [false, true]) {
        for (let shift = 0; shift < toPoints.length; shift += 1) {
          const cost = alignmentCost(fromPoints, toPoints, shift, reverse);
          if (cost < best.cost) best = { shift, reverse, cost };
        }
      }
      return shiftedPoints(toPoints, best.shift, best.reverse);
    }

    const morphPairCache = new Map();

    function buildMorphPair(fromIndex, toIndex) {
      const cacheKey = `${fromIndex}-${toIndex}`;
      if (morphPairCache.has(cacheKey)) return morphPairCache.get(cacheKey);
      const from = shapes[fromIndex];
      const to = shapes[toIndex];
      const count = Math.max(from.contours.length, to.contours.length);
      const pairs = Array.from({ length: count }, (_, index) => {
        const fromContour = from.contours[index] || collapsedAt(to.contours[index % to.contours.length]);
        const toContour = to.contours[index] || collapsedAt(fromContour);
        return { from: fromContour, to: { ...toContour, points: alignPoints(fromContour.points, toContour.points) } };
      });
      morphPairCache.set(cacheKey, pairs);
      return pairs;
    }

    function contourPath(points) {
      if (!points.length) return "";
      let d = `M${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
      for (let i = 1; i < points.length; i += 1) {
        d += ` L${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
      }
      return `${d} Z`;
    }

    function render() {
      const fromIndex = Number(fromShape.value);
      const toIndex = Number(toShape.value);
      const t = Number(progress.value) / 1000;
      output.replaceChildren();

      buildMorphPair(fromIndex, toIndex).forEach((pair) => {
        const mixed = pair.from.points.map((point, pointIndex) => ({
          x: lerp(point.x, pair.to.points[pointIndex].x, t),
          y: lerp(point.y, pair.to.points[pointIndex].y, t)
        }));
        if (polygonArea(mixed) < 4) return;
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", contourPath(mixed));
        path.setAttribute("fill", mixColor(pair.from.fill, pair.to.fill, t));
        output.appendChild(path);
      });

      progressLabel.textContent = `${Math.round(t * 100)}%`;
    }

    let animation = null;
    let continuousAnimation = null;
    let isLooping = false;

    function stopAnimation() {
      if (animation) cancelAnimationFrame(animation);
      animation = null;
    }

    function stopLoop() {
      if (continuousAnimation) cancelAnimationFrame(continuousAnimation);
      continuousAnimation = null;
      isLooping = false;
      loopButton.textContent = "Loop 1-4";
      loopButton.classList.remove("secondary");
    }

    function play() {
      stopLoop();
      stopAnimation();
      const startValue = Number(progress.value);
      const targetValue = startValue > 500 ? 0 : 1000;
      const diff = targetValue - startValue;
      const start = performance.now();
      const ms = Number(duration.value);
      function tick(now) {
        const t = clamp((now - start) / ms, 0, 1);
        progress.value = Math.round(startValue + diff * easeInOut(t));
        render();
        if (t < 1) animation = requestAnimationFrame(tick);
      }
      animation = requestAnimationFrame(tick);
    }

    function setPair(fromIndex, toIndex) {
      fromShape.value = String(fromIndex);
      toShape.value = String(toIndex);
    }

    function runLoopSegment(fromIndex, toIndex) {
      setPair(fromIndex, toIndex);
      const start = performance.now();
      const ms = Number(duration.value);
      function tick(now) {
        if (!isLooping) return;
        const t = clamp((now - start) / ms, 0, 1);
        progress.value = Math.round(easeInOut(t) * 1000);
        render();
        if (t < 1) {
          continuousAnimation = requestAnimationFrame(tick);
          return;
        }
        progress.value = 0;
        runLoopSegment(toIndex, (toIndex + 1) % shapes.length);
      }
      continuousAnimation = requestAnimationFrame(tick);
    }

    function toggleLoop() {
      if (isLooping) { stopLoop(); return; }
      stopAnimation();
      isLooping = true;
      loopButton.textContent = "Parar loop";
      loopButton.classList.add("secondary");
      progress.value = 0;
      runLoopSegment(0, 1);
    }

    const shapes = RAW_SVGS.map(parseSource);

    shapes.forEach((shape, index) => {
      fromShape.add(new Option(shape.name, index));
      toShape.add(new Option(shape.name, index));
    });
    toShape.value = "1";

    [fromShape, toShape, progress].forEach((input) => input.addEventListener("input", () => { stopLoop(); render(); }));
    duration.addEventListener("input", () => { durationLabel.textContent = `${(Number(duration.value) / 1000).toFixed(1)}s`; });
    $("play").addEventListener("click", play);
    $("loop").addEventListener("click", toggleLoop);
    $("swap").addEventListener("click", () => {
      stopLoop();
      const oldFrom = fromShape.value;
      fromShape.value = toShape.value;
      toShape.value = oldFrom;
      progress.value = 0;
      render();
    });
    $("random").addEventListener("click", () => {
      stopLoop();
      const from = Math.floor(Math.random() * shapes.length);
      let to = Math.floor(Math.random() * shapes.length);
      if (to === from) to = (to + 1) % shapes.length;
      setPair(from, to);
      progress.value = 0;
      render();
      play();
    });

    render();
  </script>
</body>
</html>
